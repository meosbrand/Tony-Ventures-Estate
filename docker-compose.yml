services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tony
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: tonymulti
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tony -d tonymulti"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tony:changeme@db:5432/tonymulti
      SESSION_SECRET: change-this-to-a-long-random-string
      PORT: "5000"
      NODE_ENV: production

      # AI Provider: "openai" or "gemini"
      AI_PROVIDER: openai

      # OpenAI (used when AI_PROVIDER=openai)
      # OPENAI_API_KEY: your-openai-api-key
      # OPENAI_MODEL: gpt-4o-mini

      # Gemini (used when AI_PROVIDER=gemini)
      # GEMINI_API_KEY: your-gemini-api-key
      # GEMINI_MODEL: gemini-1.5-flash

      # Supabase (for image storage and can also be used as the database)
      # SUPABASE_URL: https://your-project.supabase.co
      # SUPABASE_SERVICE_ROLE_KEY: your-service-role-key
      # SUPABASE_STORAGE_BUCKET: property-images

volumes:
  pgdata:
