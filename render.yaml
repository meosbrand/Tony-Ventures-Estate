services:
  - type: web
    name: tony-multi-ventures
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: NODE_PG_FORCE_NATIVE
      - key: CLIENT_URL
        value: https://tonymultiventures.vercel.app
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: property-images
      - key: SUPABASE_MEDIA_BUCKET
        value: property-media
      - key: MEDIA_STORAGE_BUDGET_MB
        value: 900
      - key: TOUR_EMBED_HOSTS
        value: my.matterport.com,kuula.co
